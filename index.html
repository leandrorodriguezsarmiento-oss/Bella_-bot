<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#170f20"><meta name="description" content="Bella Club · tu cuenta, publicaciones, ganancias y retiros PIX, vinculados a Telegram."><title>Bella Club · Mi espacio</title>
<style>
:root{color-scheme:dark;--bg:#170f20;--surface:#25192d;--raised:#302039;--line:#49324d;--text:#fff3fa;--muted:#bda9c0;--accent:#ff5caa;--accent2:#ff9fca;--good:#80e2b2;--bad:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 110% 45% at 100% -10%,#4f1f46 0,transparent 66%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.shell{max-width:1040px;margin:0 auto;min-height:100vh;padding:0 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0;border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:900;letter-spacing:.07em}.brand b{color:var(--accent)}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.23em;margin-top:-4px}.lang{font-size:12px;color:var(--muted)}h1{font-size:clamp(28px,5vw,40px);line-height:1.12;letter-spacing:-.045em;margin:22px 0 10px}h2{font-size:18px;letter-spacing:-.015em;margin:0 0 14px}.lead{color:var(--muted);max-width:580px;margin:0 0 24px}.hero{position:relative;overflow:hidden;background:linear-gradient(130deg,#512545 0,#351f40 56%,#251b35 100%);border:1px solid #704466;border-radius:26px;padding:24px;margin:24px 0}.hero:after{content:"✦";position:absolute;right:-17px;top:-67px;color:#ffffff0f;font-size:230px}.hero>*{position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--accent2)}.muted{color:var(--muted)}.small{font-size:12px}.card{background:var(--surface);border:1px solid var(--line);padding:21px;border-radius:20px;margin:14px 0}.btn{border:0;border-radius:13px;background:linear-gradient(130deg,#ff5ba7,#e83b8d);color:#230c1c;font-weight:800;padding:13px 18px;min-height:48px}.btn.secondary{border:1px solid #845173;background:#422840;color:var(--text)}.btn.ghost{border:1px solid var(--line);background:transparent;color:var(--muted)}.btn.block{width:100%}.btnrow{display:flex;gap:10px;flex-wrap:wrap}.code{padding:16px;background:#140e1c;border:1px dashed #9b668c;border-radius:14px;color:#fff;overflow-wrap:anywhere;font-size:16px;font-weight:900;letter-spacing:.02em;text-align:center;margin:14px 0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.step{border:1px solid var(--line);border-radius:16px;padding:15px;background:#211729}.step strong{display:block;margin-bottom:3px}.step p{margin:0;color:var(--muted);font-size:12px}.step span{display:inline-grid;place-items:center;background:#4e2c44;color:#ffc5e1;width:29px;height:29px;border-radius:50%;margin-bottom:9px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:20px;border:1px solid var(--line);border-radius:19px;background:var(--surface)}.stat strong{display:block;font-size:clamp(22px,4vw,31px);letter-spacing:-.025em;margin-top:4px}.stat span{font-size:12px;color:var(--muted)}.notice{padding:13px 15px;border:1px solid #775064;background:#3a243a;border-radius:12px;margin:14px 0;color:#ffdbec}.status{border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap;border:1px solid var(--line)}.status.approved,.status.paid{color:var(--good);border-color:#387259}.status.pending{color:#ffd98b;border-color:#866136}.status.rejected{color:var(--bad);border-color:#824f58}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:13px 0}.item:first-child{border-top:0}.item strong{display:block}.field{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:12px 0 6px}.input{width:100%;border:1px solid var(--line);border-radius:12px;background:#17101f;padding:13px 14px;color:var(--text);outline:none}.input:focus{border-color:var(--accent)}.nav{display:flex;gap:7px;position:sticky;bottom:12px;z-index:5;backdrop-filter:blur(10px);background:#241929ed;border:1px solid var(--line);border-radius:18px;padding:7px;margin:22px auto 0;max-width:650px}.nav button{flex:1;border:0;background:transparent;color:#bca5be;border-radius:12px;padding:10px 4px;font-size:12px;font-weight:700}.nav button.active{color:#ffaad2;background:#53304b}.nav span{display:block;font-size:21px;line-height:1.3}.footer{margin:27px 0;color:var(--muted);font-size:12px;text-align:center}.hidden{display:none!important}.photoPreview{max-width:100%;max-height:250px;border-radius:14px;display:block;margin:14px auto}.spin{display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);max-width:min(94vw,480px);z-index:20;background:#432b41;border:1px solid #a5668f;color:white;box-shadow:0 8px 32px #0009;border-radius:14px;padding:13px 20px;display:none}a{color:#ffa7d0}code{color:#fff;background:#472841;padding:2px 5px;border-radius:4px}@media(max-width:580px){.steps{grid-template-columns:1fr}.hero{padding:20px;margin:17px 0}.card{padding:17px}.shell{padding-left:14px;padding-right:14px}.nav{position:fixed;left:12px;right:12px;bottom:env(safe-area-inset-bottom,12px);margin:0;box-shadow:0 3px 30px #000a}.nav button{font-size:10px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">✦ BELLA <b>CLUB</b><small>MI ESPACIO</small></div><div class="lang">🇧🇷 BRL · Español</div></header><div id="app" aria-live="polite"></div><footer class="footer">🔞 Exclusivo para mayores de 18 años · Los pagos PIX requieren revisión manual.</footer></div><div id="toast" role="alert"></div>
<script>
(function(){
"use strict";
const app=document.getElementById('app');
const fmt=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sid=()=>crypto.randomUUID().replace(/-/g,'');
let token=sessionStorage.getItem('bella_web_session')||'',link=JSON.parse(sessionStorage.getItem('bella_pending_link')||'null'),profile=null,history={posts:[],withdrawals:[]},tab='home',busy=false,uploadedPhoto=null,uploadKey=sid(),withdrawKey=sid(),adminData=null,botUsername=sessionStorage.getItem('bella_bot_username')||'';
const el=(id)=>document.getElementById(id);
function alertBox(message){const t=el('toast');t.textContent=message;t.style.display='block';clearTimeout(alertBox.timer);alertBox.timer=setTimeout(()=>t.style.display='none',6000)}
async function api(action,method='GET',payload){
 const heads={'Content-Type':'application/json'};if(token)heads.Authorization='Bearer '+token;
 const r=await fetch('/api/web?action='+encodeURIComponent(action),{method,headers:heads,cache:'no-store',body:payload?JSON.stringify(payload):undefined});
 let j;try{j=await r.json()}catch{throw Error('Servidor no disponible')};
 if(!r.ok||!j.ok){if(r.status===401&&action!=='link'){token='';sessionStorage.removeItem('bella_web_session');render()}throw Error(j.error||'No se pudo completar')};
 return j;
}
const status=s=>({approved:'Aprobado',pending:'Pendiente',rejected:'Rechazado',paid:'Pagado'}[s]||s);
function badge(s){return '<span class="status '+esc(s)+'">'+esc(status(s))+'</span>'}
function rows(items,kind){return items.length?items.map(v=>'<div class="item"><div><strong>'+ (kind==='post'?'📸 Publicación #':'💸 PIX #')+esc(v.id)+'</strong><div class="small muted">'+esc(new Date(v.created_at).toLocaleDateString('es'))+(kind==='post'?(v.payout_amount!=null?' · '+fmt(v.payout_amount):' · '+esc(v.media_type)):' · '+fmt(v.amount))+'</div></div>'+badge(v.status)+'</div>').join(''):'<p class="muted">Todavía no hay movimientos.</p>'}
function loading(s){busy=s;document.querySelectorAll('button[data-action]').forEach(b=>b.disabled=s)}
async function refresh(){const [p,h]=await Promise.all([api('me'),api('history')]);profile=p.user;history=h;if(tab==='admin'&&profile.admin){try{adminData=await api('admin')}catch{adminData=null}}render()}
function render(){
 if(!token)return renderConnect();
 if(!profile){app.innerHTML='<p class="muted">Cargando tus datos…</p>';return}
 const nav=[['home','⌂','Inicio'],['upload','＋','Publicar'],['wallet','＄','Mi saldo'],['history','≡','Historial']];if(profile.admin)nav.push(['admin','⚙','Admin']);
 let html='';
 if(tab==='home')html='<section class="hero"><div class="eyebrow">TU ESPACIO · BELLA CLUB</div><h1>Hola, '+esc(profile.name)+' ✦</h1><p class="lead">Tus publicaciones, ganancias y solicitudes PIX, sincronizadas con el bot de Telegram.</p><div class="btnrow"><button class="btn" data-action="go-upload">＋ Enviar foto</button><button class="btn secondary" data-action="refresh">↻ Actualizar</button></div></section><div class="grid"><div class="stat"><span>💰 Saldo disponible</span><strong>'+fmt(profile.balance)+'</strong></div><div class="stat"><span>🔒 Saldo reservado</span><strong>'+fmt(profile.reserved)+'</strong></div></div><div class="card"><h2>Publicaciones recientes</h2>'+rows(history.posts.slice(0,4),'post')+'</div>';
 if(tab==='upload')html='<h1>📸 Enviar contenido</h1><p class="lead">Las fotos y videos se envían a revisión del administrador. El pago se suma al saldo solamente al aprobarse.</p><div class="card"><h2>Nueva publicación</h2><p class="muted small">Fotos JPG/PNG/WEBP y videos MP4/MOV/WEBM pequeños (máximo 2,7 MB). Para videos grandes envíalos directamente al bot de Telegram.</p><label class="field" for="photo">Selecciona una foto o video</label><input id="photo" class="input" type="file" accept="image/*,video/mp4,video/quicktime,video/webm,.mov,.mp4,.webm"><img id="preview" class="photoPreview hidden" alt="Vista previa de la foto"><video id="videoPreview" controls playsinline class="photoPreview hidden"></video><button class="btn block" data-action="upload" style="margin-top:14px">Enviar a revisión</button></div><div class="card"><h2>Mis publicaciones</h2>'+rows(history.posts,'post')+'</div>';
 if(tab==='wallet')html='<h1>💰 Mi saldo</h1><p class="lead">Este saldo es el mismo que aparece en tu cuenta de Telegram.</p><div class="grid"><div class="stat"><span>Disponible</span><strong>'+fmt(profile.balance)+'</strong></div><div class="stat"><span>Reservado</span><strong>'+fmt(profile.reserved)+'</strong></div></div><div class="card"><h2>Solicitar retiro PIX</h2><p class="muted small">Mínimo R$ 20. El importe queda reservado mientras se revisa. La transferencia se hace manualmente.</p><label class="field" for="amount">Importe en reales (R$)</label><input class="input" id="amount" type="text" inputmode="decimal" placeholder="20,00" autocomplete="off"><label class="field" for="pix">Tu clave PIX</label><input class="input" id="pix" type="text" placeholder="CPF, correo, teléfono o clave aleatoria" autocomplete="off"><button class="btn block" data-action="withdraw" style="margin-top:16px">Solicitar retiro PIX</button></div><div class="card"><h2>Mis retiros</h2>'+rows(history.withdrawals,'withdraw')+'</div>';
 if(tab==='history')html='<h1>📜 Mi historial</h1><p class="lead">Movimientos registrados en la misma base de datos que el bot.</p><div class="card"><h2>Publicaciones</h2>'+rows(history.posts,'post')+'</div><div class="card"><h2>Retiros PIX</h2>'+rows(history.withdrawals,'withdraw')+'</div>';
 if(tab==='admin'){const a=adminData;html='<h1>🛡 Panel administrador</h1><p class="lead">Aprueba publicaciones y confirma pagos desde Telegram. Aquí puedes consultar un resumen.</p><div class="card"><h2>Publicaciones</h2>'+(a?.counts?.length?a.counts.map(x=>'<div class="item"><strong>'+esc(status(x.status))+'</strong><strong>'+esc(x.n)+'</strong></div>').join(''):'<p class="muted">Sin datos disponibles.</p>')+'</div><div class="card"><h2>Retiros PIX pendientes</h2>'+(a?.pending?.length?a.pending.map(x=>'<div class="item"><div><strong>#'+esc(x.id)+' · '+fmt(x.amount)+'</strong><div class="small muted">Usuario '+esc(x.telegram_id)+' · PIX: '+esc(x.pix_key)+'</div></div>'+badge('pending')+'</div>').join(''):'<p class="muted">No hay retiros pendientes.</p>')+'</div>'}
 html+='<div class="card"><button class="btn ghost block" data-action="logout">Salir de mi cuenta</button></div><nav class="nav" aria-label="Secciones">'+nav.map(x=>'<button data-action="tab" data-tab="'+x[0]+'" class="'+(tab===x[0]?'active':'')+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')+'</nav>';
 app.innerHTML=html;
}
function renderConnect(){
 let html='<section class="hero"><div class="eyebrow">BIENVENIDO A BELLA CLUB</div><h1>Tu club, en el navegador.</h1><p class="lead">Abre tus publicaciones, consulta tu saldo real y solicita retiros PIX usando tu cuenta del bot de Telegram.</p></section><div class="steps"><div class="step"><span>1</span><strong>Abre Bella Club</strong><p>En Telegram, completa tu registro y confirmación +18 con /start.</p></div><div class="step"><span>2</span><strong>Vincula tu cuenta</strong><p>Genera un código aquí y envíalo al bot en un chat privado.</p></div><div class="step"><span>3</span><strong>Entra a tu perfil</strong><p>Verás exactamente tus datos actuales del bot.</p></div></div><div class="card"><h2>🔐 Conectar con Telegram</h2><p class="muted">Solo las cuentas mayores de 18 años pueden acceder. No necesitas crear otra contraseña.</p>';
 if(link)html+='<p class="small muted">'+(link.botUsername?'Abre Telegram con este botón, pulsa Iniciar y confirma que eres +18:':'Copia y envía este comando al bot de Bella Club por Telegram:')+'</p>'+(link.botUsername?'<a class="btn block" style="display:block;text-align:center;text-decoration:none;margin:10px 0" href="https://t.me/'+esc(link.botUsername)+'?start=web_'+esc(link.code)+'" target="_blank" rel="noopener noreferrer">✈ Abrir Telegram y vincular</a>':'')+'<div class="code" id="code">'+esc('/vincular '+link.code)+'</div><div class="btnrow"><button class="btn secondary" data-action="copy">Copiar comando</button><button class="btn" data-action="verify">Ya lo hice · Entrar</button></div><p class="muted small">Solo tendrás que vincular este teléfono una vez. El código caduca en 10 minutos. Si caduca, genera otro.</p><button class="btn ghost block" data-action="begin">Generar nuevo código</button>';
 else html+='<button class="btn block" data-action="begin">Vincular mi Telegram</button>';
 html+='</div>';app.innerHTML=html;
}
async function chosenMedia(f){
 if(f&&(/^video\/(mp4|webm|quicktime)$/.test(f.type)||/\.(mp4|mov|webm)$/i.test(f.name))){
  const type=f.type||(/\.mov$/i.test(f.name)?'video/quicktime':/\.webm$/i.test(f.name)?'video/webm':'video/mp4');
  if(f.size>2700000)throw Error('Este video supera 2,7 MB. Para videos más grandes, envíalo al bot de Telegram.');
  const encoded=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)});
  return {base64:String(encoded).split(',')[1],mime:type,preview:encoded,isVideo:true};
 }
 if(!f)return null;
 if(!/^image\/(jpeg|png|webp)$/.test(f.type))throw Error('Elige una foto JPG, PNG o WEBP');
 const url=URL.createObjectURL(f);
 try{
  const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});
  const scale=Math.min(1,1400/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
  canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
  canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
  let quality=.85,data='';
  do{data=canvas.toDataURL('image/jpeg',quality).split(',')[1];quality-=.12}while(data.length>1950000&&quality>=.34);
  if(data.length>1950000)throw Error('La imagen sigue siendo muy grande');
  return {base64:data,mime:'image/jpeg',preview:canvas.toDataURL('image/jpeg',.7),isVideo:false};
 }finally{URL.revokeObjectURL(url)}
}
app.addEventListener('change',async e=>{if(e.target.id==='photo'){try{uploadedPhoto=await chosenMedia(e.target.files[0]);uploadKey=sid();if(uploadedPhoto){const img=el('preview'),v=el('videoPreview');img.classList.toggle('hidden',uploadedPhoto.isVideo);v.classList.toggle('hidden',!uploadedPhoto.isVideo);if(uploadedPhoto.isVideo){v.src=uploadedPhoto.preview;img.removeAttribute('src')}else{img.src=uploadedPhoto.preview;v.removeAttribute('src')}}}catch(x){alertBox(x.message)}}});
app.addEventListener('click',async e=>{
 const b=e.target.closest('button[data-action]');if(!b||busy)return;const action=b.dataset.action;
 try{
  if(action==='tab'){tab=b.dataset.tab;adminData=null;await refresh();return}
  if(action==='go-upload'){tab='upload';render();return}
  if(action==='copy'){await navigator.clipboard.writeText('/vincular '+link.code);alertBox('Código copiado');return}
  if(action==='begin'){loading(true);link=await api('start','POST',{});sessionStorage.setItem('bella_pending_link',JSON.stringify(link));if(link.botUsername){botUsername=link.botUsername;sessionStorage.setItem('bella_bot_username',botUsername)}renderConnect();return}
  if(action==='verify'){loading(true);const out=await api('link','POST',{pairId:link.pairId,pollSecret:link.pollSecret});if(!out.linked){alertBox('Todavía no está vinculado. Envía el comando a tu bot y vuelve aquí.');return}token=out.session||'cookie';if(out.session)sessionStorage.setItem('bella_web_session',token);else sessionStorage.removeItem('bella_web_session');link=null;sessionStorage.removeItem('bella_pending_link');await refresh();alertBox('✅ Cuenta conectada a Telegram');return}
  if(action==='refresh'){loading(true);await refresh();alertBox('Datos actualizados');return}
  if(action==='upload'){if(!uploadedPhoto)throw Error('Primero selecciona una foto o video');loading(true);const x=await api('upload','POST',{base64:uploadedPhoto.base64,mime:uploadedPhoto.mime,requestKey:uploadKey});uploadedPhoto=null;uploadKey=sid();tab='upload';await refresh();alertBox('✅ '+(x.mediaType==='video'?'Video':'Foto')+' #'+x.id+' enviado a revisión');return}
  if(action==='withdraw'){const amount=el('amount').value.trim(),pix=el('pix').value.trim();if(!amount||!pix)throw Error('Completa el importe y tu PIX');if(!confirm('¿Solicitar retiro de R$ '+amount+' a la clave PIX indicada?'))return;loading(true);const x=await api('withdraw','POST',{amount,pix,requestKey:withdrawKey});withdrawKey=sid();await refresh();alertBox('✅ Retiro #'+x.id+' solicitado');return}
  if(action==='logout'){loading(true);await api('logout','POST',{});token='';profile=null;link=null;sessionStorage.removeItem('bella_web_session');renderConnect();return}
 }catch(x){alertBox(x.message||'No se pudo completar')}finally{loading(false)}
});
refresh().catch(e=>{if(token)alertBox(e.message);renderConnect()});
})();
</script></body></html>
